name: ALice S10+ MGLRU 3OC EROFS R2 TEST

on:
  push:
    branches:
      - agent/mglru-oc-all-erofs-r2
  workflow_dispatch:

jobs:
  build-beyond2lte:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex libelf-dev libssl-dev python3 xz-utils clang lld

      - name: Verify LLVM toolchain
        run: |
          clang --version
          ld.lld --version

      - name: Restore full pinned KernelSU history
        run: |
          if [ "$(git -C KernelSU-Next rev-parse --is-shallow-repository)" = true ]; then
            git -C KernelSU-Next fetch --unshallow --tags
          fi
          test "$(git -C KernelSU-Next rev-parse HEAD)" = fc33995cedc5e0ebf719745c71fe15e78694260f

      - name: Build and verify Image
        env:
          CLANG_DIR: /usr
          ALICE_OUT: out-alice-r2
          JOBS: 8
        run: |
          bash scripts/alice_build.sh
          cp out-alice-r2/arch/arm64/boot/Image ALice_S10Plus_MGLRU_3OC_EROFS_R2_TEST_Image
          sha256sum ALice_S10Plus_MGLRU_3OC_EROFS_R2_TEST_Image > SHA256SUMS

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S10Plus-MGLRU-3OC-EROFS-R2-TEST
          path: |
            ALice_S10Plus_MGLRU_3OC_EROFS_R2_TEST_Image
            SHA256SUMS
          if-no-files-found: error
