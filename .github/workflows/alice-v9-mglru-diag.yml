name: ALice S10+ V9 V4-based MGLRU diagnostic

on:
  push:
    branches:
      - agent/beyond2lte-v9-mglru-diag
  workflow_dispatch:

jobs:
  build-beyond2lte-v9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact V9 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex libelf-dev libssl-dev \
            python3 xz-utils clang lld llvm

      - name: Apply the boot-proven V4 KernelSU-Next SUSFS bridge
        run: |
          test "$(git -C KernelSU-Next rev-parse HEAD)" = fd093e8b879063aeb0192a3959b0652101ded623
          git apply --check --directory=KernelSU-Next .github/alice-ksunext-susfs-v2.2.patch
          git apply --directory=KernelSU-Next .github/alice-ksunext-susfs-v2.2.patch
          git apply --check --directory=KernelSU-Next .github/alice-ksu-devpts-compat.patch
          git apply --directory=KernelSU-Next .github/alice-ksu-devpts-compat.patch

      - name: Verify isolated V9 source profile
        run: |
          grep -q '^CONFIG_ALICE_EXYNOS9820_FREQ_ONLY_OC=y$' arch/arm64/configs/beyond2lte.config
          grep -q '^CONFIG_LRU_GEN=y$' arch/arm64/configs/beyond2lte.config
          grep -q '^# CONFIG_LRU_GEN_ENABLED is not set$' arch/arm64/configs/beyond2lte.config
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' arch/arm64/configs/beyond2lte.config
          ! grep -q '^CONFIG_ALICE_ZRAM_PROFILE=y$' arch/arm64/configs/beyond2lte.config
          ! grep -q '^CONFIG_ALICE_EAS_BALANCED=y$' arch/arm64/configs/beyond2lte.config
          grep -q 'static const char \*default_compressor = "lz4";' drivers/block/zram/zram_drv.c
          git diff --check

      - name: Build beyond2lte V9
        run: |
          chmod +x build.sh
          ./build.sh -m beyond2lte -k y -r n

      - name: Verify kernel, LMKD prerequisites and dormant MGLRU
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s build/out/beyond2lte/boot.img
          test -s build/out/beyond2lte/dtbo.img
          grep -q '^CONFIG_ALICE_EXYNOS9820_FREQ_ONLY_OC=y$' out/.config
          grep -q '^CONFIG_LRU_GEN=y$' out/.config
          grep -q '^# CONFIG_LRU_GEN_ENABLED is not set$' out/.config
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' out/.config
          ! grep -q '^CONFIG_ALICE_ZRAM_PROFILE=y$' out/.config
          grep -q '^CONFIG_CRYPTO_LZ4=y$' out/.config
          grep -q '^CONFIG_PSI=y$' out/.config
          grep -q '^CONFIG_MEMCG=y$' out/.config
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_EROFS_FS=y$' out/.config
          nm out/vmlinux | grep -E ' (lru_gen_|susfs_)' > out/v9-linked-symbols.txt
          test -s out/v9-linked-symbols.txt
          grep -q ' lru_gen_init_lruvec$' out/v9-linked-symbols.txt
          grep -q ' susfs_init$' out/v9-linked-symbols.txt
          sha256sum out/arch/arm64/boot/Image build/out/beyond2lte/boot.img build/out/beyond2lte/dtbo.img

      - name: Collect V9 artifacts
        run: |
          mkdir -p alice-v9-artifacts
          cp out/arch/arm64/boot/Image alice-v9-artifacts/ALice_S10Plus_V9_MGLRU_DIAG_Image
          cp build/out/beyond2lte/boot.img alice-v9-artifacts/ALice_S10Plus_V9_REPO_BOOT.img
          cp build/out/beyond2lte/dtbo.img alice-v9-artifacts/ALice_S10Plus_V9_REPO_DTBO.img
          cp out/.config alice-v9-artifacts/ALice_S10Plus_V9.config
          cp out/v9-linked-symbols.txt alice-v9-artifacts/ALice_S10Plus_V9_LINKED_SYMBOLS.txt
          cp docs/ALICE_S10PLUS_V9_MGLRU_DIAG.md alice-v9-artifacts/
          sha256sum alice-v9-artifacts/* > alice-v9-artifacts/SHA256SUMS

      - name: Upload V9 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S10Plus-V9-MGLRU-DIAG
          path: alice-v9-artifacts/
          if-no-files-found: error
