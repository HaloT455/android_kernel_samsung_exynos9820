name: ALice S10+ V9 KSU 32567 + MGLRU enabled + sucompat fix

on:
  push:
    branches:
      - agent/beyond2lte-v9-mglru-diag
  workflow_dispatch:

jobs:
  build-beyond2lte-v9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact V9 branch
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex libelf-dev libssl-dev \
            python3 xz-utils clang lld llvm

      - name: Pin longuirom KernelSU ABI 32567 and merge SUSFS 2.2
        run: |
          git clone --branch 32567b --single-branch https://github.com/longuirom/KernelSU.git KernelSU-Longui
          test "$(git -C KernelSU-Longui rev-parse HEAD)" = 7bd071c11f5a4d22729d73179d149493a6362a26
          git -C KernelSU-Longui fetch --depth=1 origin b7d830918d863eaa88581fc88114065cc2d3e6b4
          for path in \
            Kconfig \
            feature/kernel_umount.c \
            ksu.c \
            selinux/rules.c \
            selinux/selinux.c \
            selinux/selinux.h \
            supercall/dispatch.c \
            supercall/supercall.c
          do
            mkdir -p "/tmp/ksu-v9-base/kernel/$(dirname "$path")"
            git -C KernelSU-Longui show b7d830918d863eaa88581fc88114065cc2d3e6b4:"kernel/$path" > "/tmp/ksu-v9-base/kernel/$path"
            git merge-file --theirs \
              "KernelSU-Longui/kernel/$path" \
              "/tmp/ksu-v9-base/kernel/$path" \
              ".github/v9-longuirom-overlay/kernel/$path"
          done
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' KernelSU-Longui/kernel
          rm drivers/kernelsu
          ln -s ../KernelSU-Longui/kernel drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = ../KernelSU-Longui/kernel
          grep -q 'KSU_VERSION=32567' KernelSU-Longui/kernel/Makefile
          grep -q 'config KSU_SUSFS' KernelSU-Longui/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU-Longui/kernel/ksu.c
          grep -q 'SUSFS_MAGIC' KernelSU-Longui/kernel/supercall/supercall.c
          git -C KernelSU-Longui apply --check ../.github/patches/v9r2-sucompat-allowlist.patch
          git -C KernelSU-Longui apply ../.github/patches/v9r2-sucompat-allowlist.patch
          python3 .github/scripts/check-v9-sucompat.py KernelSU-Longui/kernel/feature/sucompat.c

      - name: Verify isolated V9 source profile
        run: |
          grep -q '^CONFIG_ALICE_EXYNOS9820_FREQ_ONLY_OC=y$' arch/arm64/configs/beyond2lte.config
          grep -q '^CONFIG_LRU_GEN=y$' arch/arm64/configs/beyond2lte.config
          grep -q '^CONFIG_LRU_GEN_ENABLED=y$' arch/arm64/configs/beyond2lte.config
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' arch/arm64/configs/beyond2lte.config
          ! grep -q '^CONFIG_ALICE_ZRAM_PROFILE=y$' arch/arm64/configs/beyond2lte.config
          ! grep -q '^CONFIG_ALICE_EAS_BALANCED=y$' arch/arm64/configs/beyond2lte.config
          grep -q 'static const char \*default_compressor = "lz4";' drivers/block/zram/zram_drv.c
          grep -q '^#define SUSFS_VERSION "v2.2.0"$' include/linux/susfs.h
          ! grep -q 'ksu_handle_execveat' fs/exec.c
          ! grep -q 'ksu_handle_faccessat' fs/open.c
          ! grep -q 'ksu_handle_sys_read' fs/read_write.c
          ! grep -q 'ksu_handle_stat' fs/stat.c
          ! grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          ! grep -q 'ksu_handle_devpts' fs/devpts/inode.c
          ! grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          git diff --check

      - name: Build beyond2lte V9
        id: kernel_build
        run: |
          chmod +x build.sh
          ./build.sh -m beyond2lte -k y -r n

      - name: Verify kernel, LMKD, KSU, SUSFS and MGLRU enabled + sucompat fix
        if: ${{ always() && steps.kernel_build.outcome == 'success' }}
        run: |
          set -euxo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s build/out/beyond2lte/boot.img
          test -s build/out/beyond2lte/dtbo.img
          grep -q '^CONFIG_ALICE_EXYNOS9820_FREQ_ONLY_OC=y$' out/.config
          grep -q '^CONFIG_LRU_GEN=y$' out/.config
          grep -q '^CONFIG_LRU_GEN_ENABLED=y$' out/.config
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' out/.config
          ! grep -q '^CONFIG_ALICE_ZRAM_PROFILE=y$' out/.config
          grep -q '^CONFIG_CRYPTO_LZ4=y$' out/.config
          grep -q '^CONFIG_PSI=y$' out/.config
          grep -q '^CONFIG_MEMCG=y$' out/.config
          grep -q '^# CONFIG_ARM64_HW_AFDBM is not set$' out/.config
          ! grep -q '^CONFIG_ARCH_HAS_NONLEAF_PMD_YOUNG=y$' out/.config
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y$' out/.config
          ! grep -q '^CONFIG_KSU_KPROBES_KSUD=y$' out/.config
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' out/.config
          grep -q '^CONFIG_EROFS_FS=y$' out/.config
          nm out/vmlinux | grep -E ' (lru_gen_|susfs_|try_umount)' > out/v9-linked-symbols.txt
          test -s out/v9-linked-symbols.txt
          grep -q ' lru_gen_init_lruvec$' out/v9-linked-symbols.txt
          grep -q ' susfs_init$' out/v9-linked-symbols.txt
          grep -Eq ' (try_umount|ksu_handle_umount)(\\.|$)' out/v9-linked-symbols.txt
          sha256sum out/arch/arm64/boot/Image build/out/beyond2lte/boot.img build/out/beyond2lte/dtbo.img

      - name: Collect V9 artifacts
        if: ${{ always() && steps.kernel_build.outcome == 'success' }}
        run: |
          mkdir -p alice-v9-artifacts
          cp out/arch/arm64/boot/Image alice-v9-artifacts/ALice_S10Plus_V9R2_KSU32567_MGLRU_Image
          cp build/out/beyond2lte/boot.img alice-v9-artifacts/ALice_S10Plus_V9_REPO_BOOT.img
          cp build/out/beyond2lte/dtbo.img alice-v9-artifacts/ALice_S10Plus_V9_REPO_DTBO.img
          cp out/.config alice-v9-artifacts/ALice_S10Plus_V9.config
          cp out/v9-linked-symbols.txt alice-v9-artifacts/ALice_S10Plus_V9_LINKED_SYMBOLS.txt
          cp docs/ALICE_S10PLUS_V9R2.md alice-v9-artifacts/
          sha256sum alice-v9-artifacts/* > alice-v9-artifacts/SHA256SUMS

      - name: Upload V9 artifacts
        if: ${{ always() && steps.kernel_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S10Plus-V9R2-EPICD-MGLRU
          path: alice-v9-artifacts/
          if-no-files-found: error
